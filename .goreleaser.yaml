# goreleaser config — produces release artifacts for mailtrap-local.
#
# Channels published:
#   1. GitHub Releases    — .tar.gz binary archives (darwin/linux × amd64/arm64)
#   2. Homebrew tap       — PR updating Formula/mailtrap-local.rb in mailtrap/homebrew-local
#   3. NUR                — PR updating pkgs/mailtrap-local/default.nix in mailtrap/mailtrap-nur
#   4. Docker Hub         — mailtrap/mailtrap-local:{version,latest}
#   5. GHCR               — ghcr.io/mailtrap/mailtrap-local:{version,latest}
#   6. Snap Store         — .snap for linux/amd64 + linux/arm64 (needs snapcraft)
#
# The releaser needs:
#   - GITHUB_TOKEN with write to mailtrap/mailtrap-local
#   - GORELEASER_TOKEN for cross-repo publishes (homebrew-local, mailtrap-nur, …)
#   - DOCKERHUB_USERNAME + DOCKERHUB_TOKEN for the docker push
#   - SNAPCRAFT_STORE_CREDENTIALS to upload snaps (`snapcraft` on PATH)
#   - ghcr.io auth via GITHUB_TOKEN (free, no extra secret)
#
# Usage:
#   goreleaser release --snapshot --clean --skip=docker,nix,homebrew
#     # Linux + snapcraft: pack .snap files, no store/GitHub/Docker publish
#   goreleaser release --snapshot --clean        # local dry-run, no publish
#   GITHUB_TOKEN=... DOCKERHUB_TOKEN=... \       # real release on a tag
#     goreleaser release --clean
#
# Tag scheme: v0.1.0, v0.1.1, v1.0.0, … (SemVer; the leading `v` is required).

version: 2

# `before` runs once per release and stages embed inputs next to main.go,
# because //go:embed cannot traverse `..`. Without this, every cross-build
# in `builds:` would embed a stale frontend.
before:
  hooks:
    - go mod download
    # Frontend build → cmd/mailtrap-local/dist
    - sh -c "cd frontend && npm ci --no-audit --no-fund && npm run build"
    - sh -c "rm -rf cmd/mailtrap-local/dist && cp -R frontend/dist cmd/mailtrap-local/dist"
    # OpenAPI spec → cmd/mailtrap-local/openapi.yaml
    - sh -c "cp docs/api/openapi.yaml cmd/mailtrap-local/openapi.yaml"

builds:
  - id: mailtrap-local
    main: ./cmd/mailtrap-local
    binary: mailtrap-local
    env:
      # modernc.org/sqlite is pure-Go; no CGo means trivial cross-compile
      # and a static binary (works inside distroless).
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: mailtrap-local
    ids: [mailtrap-local]
    # Standard Go-tool layout: mailtrap-local_{version}_{os}_{arch}.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
    # `format` defaults to tar.gz on Unix — kept implicit so future
    # Windows builds (when added) get .zip without a override.

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Snapshot builds (dry-run) get a synthetic version like
  # 0.1.0-next-SHA so they don't collide with a real tag.
  version_template: "{{ incpatch .Version }}-next-{{ .ShortCommit }}"

changelog:
  # Curated notes live in CHANGELOG.md; goreleaser also groups commits
  # since the last tag into the GitHub release body.
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^(feat|add)(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: mailtrap
    name: mailtrap-local
  draft: false
  prerelease: auto
  header: |
    ## mailtrap-local {{ .Tag }}

    Single-binary local email sandbox + catcher — SMTP + Web UI + JSON
    API in one process. See `README.md` for install instructions.
  footer: |
    ---
    **Channels:**
    - Homebrew: `brew install mailtrap/local/mailtrap-local`
    - Nix:      `nix run github:mailtrap/mailtrap-nur#mailtrap-local`
    - Snap:     `sudo snap install mailtrap-local`
    - Docker:   `docker run -p 3535:3535 -p 3550:3550 mailtrap/mailtrap-local:{{ .Tag }}`
    - Binary:   download the platform tarball above and `tar xzf`.

    On macOS, an unsigned binary needs a one-time Gatekeeper bypass:
    `xattr -d com.apple.quarantine ./mailtrap-local`
  # Snap artifacts are store-publishable, not release-uploadable, so
  # goreleaser leaves them out of the GitHub release unless asked.
  extra_files:
    - glob: ./dist/*.snap

# ---------------------------------------------------------------------
# Homebrew tap — on every tagged release, open a PR that updates
# Formula/mailtrap-local.rb in mailtrap/homebrew-local (main requires
# PRs). Branch defaults to {{ .ProjectName }}-{{ .Version }} when
# pull_request.enabled is true.
# ---------------------------------------------------------------------
brews:
  - name: mailtrap-local
    repository:
      owner: mailtrap
      name: homebrew-local
      # Cross-repo token; GITHUB_TOKEN cannot write the tap.
      token: "{{ .Env.GORELEASER_TOKEN }}"
      pull_request:
        enabled: true
    directory: Formula
    homepage: "https://github.com/mailtrap/mailtrap-local"
    description: "Local email sandbox + catcher: SMTP + Web UI + JSON API in one binary"
    license: "MIT"
    install: |
      bin.install "mailtrap-local"
      # Sendmail-replacement symlink — same binary, dispatched on argv[0]
      # basename (see cmd/mailtrap-local/sendmail.go).
      bin.install_symlink "mailtrap-local" => "mailtrap-sendmail"
    service: |
      run [opt_bin/"mailtrap-local",
           "--http-listen", "127.0.0.1:3550",
           "--smtp-listen", "127.0.0.1:3535",
           "--db", "#{var}/mailtrap-local/db.sqlite3"]
      keep_alive true
      log_path "#{var}/log/mailtrap-local.log"
      error_log_path "#{var}/log/mailtrap-local.log"
    test: |
      assert_match version.to_s, shell_output("#{bin}/mailtrap-local --version")

# ---------------------------------------------------------------------
# NUR — on every tagged release, open a PR that updates
# pkgs/mailtrap-local/default.nix in mailtrap/mailtrap-nur (same pattern
# as the Homebrew tap). Needs nix-hash on PATH (see release.yml).
# ---------------------------------------------------------------------
nix:
  - name: mailtrap-local
    ids: [mailtrap-local]
    repository:
      owner: mailtrap
      name: mailtrap-nur
      token: "{{ .Env.GORELEASER_TOKEN }}"
      pull_request:
        enabled: true
    path: pkgs/mailtrap-local/default.nix
    homepage: "https://github.com/mailtrap/mailtrap-local"
    description: "Local email sandbox + catcher: SMTP + Web UI + JSON API in one binary"
    license: mit
    main_program: mailtrap-local
    # Default install copies the binary; add sendmail-replacement symlink
    # (same as Homebrew Formula).
    extra_install: |
      ln -s mailtrap-local $out/bin/mailtrap-sendmail

# ---------------------------------------------------------------------
# Snap Store — packs the linux binaries goreleaser just built (no dump
# from a GitHub tarball). snapcraft must be on PATH; see release.yml.
# Channel list is stable-only; goreleaser's default also pushes edge/beta.
# ---------------------------------------------------------------------
snapcrafts:
  - id: mailtrap-local
    ids: [mailtrap-local]
    name: mailtrap-local
    title: Mailtrap Local
    publish: true
    summary: Local email sandbox + catcher for individual developers
    description: |
      Runs on your laptop, catches every email your app sends, and gives you
      a web sandbox to browse, search, and inspect them in. One self-contained
      binary.

      Point any app at SMTP 127.0.0.1:3535. Open http://127.0.0.1:3550 to
      search and inspect HTML, text, raw source, headers, and attachments.
      The same port serves a REST API - existing clients only need a host
      override. Includes HTML email-client compatibility checks, categories,
      release to production SMTP, and outbound webhooks.

      Not a team tool: no accounts, no auth, no shared sandboxes. SQLite only.
      Localhost only. Complements hosted Mailtrap; it is not a Sandbox
      replacement.
    license: MIT
    grade: stable
    confinement: strict
    base: core22
    channel_templates:
      - stable
    # No `icon:` here on purpose — goreleaser would write it into snap.yaml,
    # and the Snap Store schema rejects that key ("Additional properties are
    # not allowed ('icon' was unexpected)"). The store reads the icon from
    # meta/gui/icon.png inside the snap instead, which extra_files stages.
    extra_files:
      - source: snap/gui/icon.png
        destination: meta/gui/icon.png
    apps:
      mailtrap-local:
        command: mailtrap-local
        args: --db $SNAP_USER_COMMON/db.sqlite3
        environment:
          MAILTRAP_LOCAL_SECRET_KEY_FILE: $SNAP_USER_COMMON/secret.key
        plugs: [home, network, network-bind]

# ---------------------------------------------------------------------
# Docker images — built once per arch, then combined into a manifest
# list so `docker pull` picks the right binary automatically.
# ---------------------------------------------------------------------
dockers:
  - id: ghcr-amd64
    image_templates:
      - "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}-amd64"
      - "docker.io/mailtrap/mailtrap-local:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=mailtrap-local"
      - "--label=org.opencontainers.image.description=Local email sandbox + catcher: SMTP + Web UI + JSON API in one binary"
      - "--label=org.opencontainers.image.url=https://github.com/mailtrap/mailtrap-local"
      - "--label=org.opencontainers.image.source=https://github.com/mailtrap/mailtrap-local"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: ghcr-arm64
    image_templates:
      - "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}-arm64"
      - "docker.io/mailtrap/mailtrap-local:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=mailtrap-local"
      - "--label=org.opencontainers.image.description=Local email sandbox + catcher: SMTP + Web UI + JSON API in one binary"
      - "--label=org.opencontainers.image.url=https://github.com/mailtrap/mailtrap-local"
      - "--label=org.opencontainers.image.source=https://github.com/mailtrap/mailtrap-local"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}"
    image_templates:
      - "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}-amd64"
      - "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}-arm64"
  - name_template: "ghcr.io/mailtrap/mailtrap-local:latest"
    image_templates:
      - "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}-amd64"
      - "ghcr.io/mailtrap/mailtrap-local:{{ .Version }}-arm64"
  - name_template: "docker.io/mailtrap/mailtrap-local:{{ .Version }}"
    image_templates:
      - "docker.io/mailtrap/mailtrap-local:{{ .Version }}-amd64"
      - "docker.io/mailtrap/mailtrap-local:{{ .Version }}-arm64"
  - name_template: "docker.io/mailtrap/mailtrap-local:latest"
    image_templates:
      - "docker.io/mailtrap/mailtrap-local:{{ .Version }}-amd64"
      - "docker.io/mailtrap/mailtrap-local:{{ .Version }}-arm64"
