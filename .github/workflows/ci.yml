name: ci

# Runs on every push and PR. Five jobs that run in parallel:
#   - go    — golangci-lint, go vet, go test (every package, race detector on)
#   - frontend — TypeScript build + ESLint + vitest
#   - build — `scripts/build.sh` smoke + SMTP send/confirm
#   - docker — builds Dockerfile + Dockerfile.goreleaser, boots each on
#     DEFAULT CMD, then SMTP send/confirm (catches bad CMD, root-owned
#     VOLUME mount, or broken SMTP ingest path)
#   - snap — goreleaser snapshot pack (no store upload) + install --dangerous
#     + SMTP smoke (catches snap.yaml, plugs, SNAP_USER_COMMON db path)
#
# OpenAPI drift is covered by the `go` job — internal/api/openapi_drift_test.go
# walks the live router and fails if anything's out of sync with the spec.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout 10m0s ./cmd/... ./internal/...

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      # `-count=1` disables the test cache so flaky tests can't pass via
      # cached green from a previous run. `-race` catches concurrency
      # bugs in jobs/ and api/ (both have goroutines).
      - name: go test
        run: go test -race -count=1 ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # `npm run build` runs `tsc -b && vite build`. The TypeScript
      # build catches type regressions; vite catches missing imports.
      - run: npm run build

      - run: npm run lint

      # Vitest unit tests (jsdom + @testing-library). Covers the cable
      # module, the messages-channel hook (incl. the defensive-fix
      # regression test), Toggle, and the API error-extraction helper.
      - run: npm test

  build:
    # The build job is the integration test for the release pipeline —
    # it runs the same `scripts/build.sh` goreleaser invokes via its
    # `before:` hooks. Catches embed-staging regressions before tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: scripts/build.sh
        run: bash scripts/build.sh

      - name: smoke (--version)
        run: ./bin/mailtrap-local --version

      - name: smoke (boot + curl + SMTP)
        run: |
          ./bin/mailtrap-local --http-listen 127.0.0.1:13550 --smtp-listen 127.0.0.1:13535 --db :memory: &
          PID=$!
          # give it a beat to bind sockets
          for _ in 1 2 3 4 5; do sleep 0.4; curl -sf http://127.0.0.1:13550/api/v1/messages && break; done
          curl -sf -o /tmp/mtl-openapi.yaml http://127.0.0.1:13550/api/v1/openapi.yaml
          head -n 1 /tmp/mtl-openapi.yaml | grep -q '^openapi:'
          curl -sf http://127.0.0.1:13550/ | grep -q '<div id="root"'
          HTTP_BASE=http://127.0.0.1:13550 SMTP_URL=smtp://127.0.0.1:13535 \
            node --experimental-strip-types scripts/smoke-smtp.ts
          kill "$PID"

  docker:
    # Builds both images and boots each with its DEFAULT CMD — exactly
    # what `docker run mailtrap/mailtrap-local` does. The raw-binary
    # smoke above runs ./bin/mailtrap-local with explicit loopback flags,
    # so it can't catch image-level regressions: a broken CMD, the
    # loopback guard rejecting the image's 0.0.0.0 bind (which once
    # crash-looped the published image on boot), or a VOLUME mount
    # point that is root-owned so nonroot cannot create db.sqlite3.
    # Dockerfile.goreleaser is what goreleaser publishes; the source
    # Dockerfile alone does not cover that path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: docker build (Dockerfile)
        run: docker build -t mailtrap-local:ci .

      - name: boot Dockerfile image on default CMD + curl + SMTP
        run: |
          docker run -d --name mtl -p 13550:3550 -p 13535:3535 mailtrap-local:ci
          ok=
          for _ in $(seq 1 20); do
            sleep 0.5
            if curl -sf http://127.0.0.1:13550/api/v1/messages >/dev/null; then ok=1; break; fi
          done
          docker logs mtl
          if [ -z "$ok" ]; then
            echo "::error::container did not serve the API on its default CMD"
            docker rm -f mtl
            exit 1
          fi
          curl -sf -o /tmp/mtl-openapi.yaml http://127.0.0.1:13550/api/v1/openapi.yaml
          head -n 1 /tmp/mtl-openapi.yaml | grep -q '^openapi:'
          HTTP_BASE=http://127.0.0.1:13550 SMTP_URL=smtp://127.0.0.1:13535 \
            node --experimental-strip-types scripts/smoke-smtp.ts
          docker rm -f mtl

      # Reuse the binary from the source image so we do not rebuild the
      # frontend/Go stages just to exercise the release Dockerfile.
      - name: docker build (Dockerfile.goreleaser)
        run: |
          cid=$(docker create mailtrap-local:ci)
          docker cp "$cid:/usr/local/bin/mailtrap-local" ./mailtrap-local
          docker rm "$cid"
          docker build -f Dockerfile.goreleaser -t mailtrap-local:ci-goreleaser .

      - name: boot goreleaser image on default CMD + curl + SMTP
        run: |
          docker run -d --name mtl-gr -p 13551:3550 -p 13536:3535 mailtrap-local:ci-goreleaser
          ok=
          for _ in $(seq 1 20); do
            sleep 0.5
            if curl -sf http://127.0.0.1:13551/api/v1/messages >/dev/null; then ok=1; break; fi
          done
          docker logs mtl-gr
          if [ -z "$ok" ]; then
            echo "::error::goreleaser image did not serve the API on its default CMD"
            docker rm -f mtl-gr
            exit 1
          fi
          curl -sf -o /tmp/mtl-openapi.yaml http://127.0.0.1:13551/api/v1/openapi.yaml
          head -n 1 /tmp/mtl-openapi.yaml | grep -q '^openapi:'
          HTTP_BASE=http://127.0.0.1:13551 SMTP_URL=smtp://127.0.0.1:13536 \
            node --experimental-strip-types scripts/smoke-smtp.ts
          docker rm -f mtl-gr

  snap:
    # Packs linux snaps the same way the tag release does, but
    # --snapshot implies --skip=publish (no Snap Store / GitHub Release).
    # --skip=docker,nix,homebrew avoids the other publishers' toolchains.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Pack snaps (snapshot, no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=docker,nix,homebrew
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: host

      - name: Install amd64 snap and smoke
        run: |
          set -euo pipefail
          snapf=$(ls dist/*_linux_amd64.snap)
          sudo snap install --dangerous "$snapf"
          mailtrap-local --version
          mailtrap-local --http-listen 127.0.0.1:13550 --smtp-listen 127.0.0.1:13535 &
          PID=$!
          ok=
          for _ in 1 2 3 4 5 6 7 8; do
            sleep 0.4
            if curl -sf http://127.0.0.1:13550/api/v1/messages >/dev/null; then ok=1; break; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::snapped mailtrap-local did not serve the API"
            kill "$PID" || true
            exit 1
          fi
          curl -sf -o /tmp/mtl-openapi.yaml http://127.0.0.1:13550/api/v1/openapi.yaml
          head -n 1 /tmp/mtl-openapi.yaml | grep -q '^openapi:'
          HTTP_BASE=http://127.0.0.1:13550 SMTP_URL=smtp://127.0.0.1:13535 \
            node --experimental-strip-types scripts/smoke-smtp.ts
          kill "$PID"
          test -f "$HOME/snap/mailtrap-local/common/db.sqlite3"
